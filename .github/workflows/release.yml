name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      major: ${{ steps.release.outputs.major }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # Runs this commit's copy of the action, so every push to main tries it out.
      - uses: actions/checkout@v7
      - uses: ./release-please
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # Callers can follow a major version with @v1 instead of pinning a commit.
  major-tag:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Move the major tag to the release
        env:
          TAG: v${{ needs.release-please.outputs.major }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          git tag --force "$TAG" "$SHA"
          git push --force origin "refs/tags/$TAG"
